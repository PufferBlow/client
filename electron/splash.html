<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pufferblow</title>
  <!--
    Splash screen shown while:
      1. The renderer bundle parses + the React tree mounts at app
         launch.
      2. The auto-updater downloads a release in the background; the
         progress bar tracks the download.
      3. The user switches accounts in the renderer (the renderer
         opens this same splash markup as an in-window overlay; main
         doesn't repaint a separate splash window for switches).

    Constraints kept tight on purpose:
      - No external assets (fonts, network requests). Even Google
        Fonts would flash uglier than no font swap at all.
      - All CSS / SVG / motion inline. The only JS is the
        `__pbSetSplashStatus` shim + the progress bar setter that
        main.ts calls via `executeJavaScript`.
      - Transparent frameless window in main.ts, body is the only
        painted element.
  -->
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .pb-splash-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 0 28px;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.04), transparent 65%),
        #0a0a0a;
      color: #fafafa;
      border-radius: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      -webkit-app-region: drag;
    }

    /*
     * Same geometry as PufferblowMark in the renderer
     * (`app/components/PufferblowBrand.tsx`) so splash and post-mount
     * logo line up perfectly.
     */
    .pb-splash-logo {
      width: 88px;
      height: 88px;
      animation: pbSplashBreathe 2.6s ease-in-out infinite;
    }

    .pb-splash-logo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pb-splash-spokes {
      transform-box: fill-box;
      transform-origin: center;
      animation: pbSplashRotate 9s linear infinite;
    }

    .pb-splash-mark line {
      stroke: #fafafa;
      stroke-width: 3.2;
      stroke-linecap: round;
      fill: none;
    }

    .pb-splash-mark .pb-splash-ring {
      stroke: #fafafa;
      stroke-width: 3.2;
      fill: none;
    }

    .pb-splash-mark .pb-splash-knockout {
      fill: #0a0a0a;
    }

    .pb-splash-mark .pb-splash-dot {
      fill: #fafafa;
      transform-box: fill-box;
      transform-origin: center;
      animation: pbSplashDot 2.6s ease-in-out infinite;
    }

    /* Wordmark stays small. The slogan below is the headline. */
    .pb-splash-wordmark {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(250, 250, 250, 0.55);
    }

    /*
     * Slogan replaces the old "Loading" status line. It's persistent
     * brand copy — the progress bar carries the "we're working" signal
     * on its own, so the text doesn't need to flicker through state.
     */
    .pb-splash-slogan {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fafafa;
      text-align: center;
      line-height: 1.15;
    }

    /*
     * Progress bar. Two modes:
     *   1. Indeterminate (default): a small "comet" slides
     *      left-to-right inside the track while the React tree mounts.
     *      `__pbSetSplashProgress(null)` brings this back if main has
     *      no concrete percent.
     *   2. Determinate: a normal left-anchored fill grows toward the
     *      right based on `--progress` (0..100). Used by the
     *      auto-updater while a release downloads.
     *
     * The track sits in a fixed-width frame so the visual rhythm
     * doesn't shift as the splash window's content height changes.
     */
    .pb-splash-progress {
      width: 220px;
      height: 4px;
      border-radius: 9999px;
      background: rgba(250, 250, 250, 0.12);
      overflow: hidden;
      position: relative;
    }

    .pb-splash-progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress, 0%);
      background: #fafafa;
      border-radius: 9999px;
      transition: width 200ms ease;
    }

    /* Indeterminate "comet" — visible only when the parent has the
       `indeterminate` class. Animates a narrow chip across the bar so
       the user sees motion even before main reports a concrete
       percent. */
    .pb-splash-progress.indeterminate .pb-splash-progress-fill {
      animation: pbSplashIndeterminate 1.4s ease-in-out infinite;
      width: 35%;
    }

    /* Detail line under the bar: download throughput, version, etc.
       Reserved height so the slogan never jumps. */
    .pb-splash-detail {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(250, 250, 250, 0.45);
      min-height: 14px;
      tab-size: 2;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    @keyframes pbSplashBreathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }

    @keyframes pbSplashRotate {
      to { transform: rotate(360deg); }
    }

    @keyframes pbSplashDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.85); }
    }

    @keyframes pbSplashIndeterminate {
      0%   { left: -35%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pb-splash-logo,
      .pb-splash-spokes,
      .pb-splash-mark .pb-splash-dot,
      .pb-splash-progress.indeterminate .pb-splash-progress-fill {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="pb-splash-shell">
    <div class="pb-splash-logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="pb-splash-mark">
        <g class="pb-splash-spokes">
          <line x1="50" y1="50" x2="82" y2="50" />
          <line x1="50" y1="50" x2="18" y2="50" />
          <line x1="50" y1="50" x2="50" y2="82" />
          <line x1="50" y1="50" x2="50" y2="18" />
          <line x1="50" y1="50" x2="73" y2="73" />
          <line x1="50" y1="50" x2="27" y2="27" />
          <line x1="50" y1="50" x2="27" y2="73" />
          <line x1="50" y1="50" x2="73" y2="27" />
        </g>
        <circle class="pb-splash-knockout" cx="50" cy="50" r="21" />
        <circle class="pb-splash-ring" cx="50" cy="50" r="21" />
        <circle class="pb-splash-dot" cx="50" cy="50" r="3.2" />
      </svg>
    </div>

    <div class="pb-splash-wordmark">Pufferblow</div>
    <div class="pb-splash-slogan">Create space</div>

    <div id="pb-splash-progress" class="pb-splash-progress indeterminate" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="pb-splash-progress-fill"></div>
    </div>
    <div id="pb-splash-detail" class="pb-splash-detail"></div>
  </div>

  <script>
    // Status copy still goes to a hidden text element — main.ts and the
    // renderer overlay both use `__pbSetSplashStatus` to push a one-line
    // hint (download speed, mount step). Kept on the dedicated detail
    // line so the slogan never moves.
    window.__pbSetSplashStatus = function (text) {
      var el = document.getElementById('pb-splash-detail');
      if (el) el.textContent = String(text || '');
    };

    // Progress setter. Pass a percent 0..100 to switch to determinate
    // mode; pass null to revert to indeterminate (the comet animation).
    // ARIA's `aria-valuenow` is updated alongside the visual fill so
    // assistive tech tracks the same value.
    window.__pbSetSplashProgress = function (percent) {
      var track = document.getElementById('pb-splash-progress');
      var fill = track ? track.querySelector('.pb-splash-progress-fill') : null;
      if (!track || !fill) return;
      if (percent === null || percent === undefined || isNaN(percent)) {
        track.classList.add('indeterminate');
        track.removeAttribute('aria-valuenow');
        fill.style.removeProperty('--progress');
        return;
      }
      var clamped = Math.max(0, Math.min(100, Number(percent)));
      track.classList.remove('indeterminate');
      track.setAttribute('aria-valuenow', String(Math.round(clamped)));
      fill.style.setProperty('--progress', clamped + '%');
    };
  </script>
</body>
</html>
