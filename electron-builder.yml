appId: space.pufferblow.client
productName: Pufferblow
copyright: Pufferblow contributors
buildVersion: "1.0.0"

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**
  - build/client/**
  - resources/icons/**
  - package.json

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]

# `nsis` lives at the config root in electron-builder 26.x (it was under
# `win.nsis` in 25.x and earlier). Moving it back under `win` makes the
# schema validator reject the whole config at build time.
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true

linux:
  icon: resources/icons/icon.png
  category: Network
  target:
    - AppImage
    - deb
    - rpm

mac:
  icon: resources/icons/icon.icns
  category: public.app-category.social-networking
  minimumSystemVersion: "10.15"
  identity: null
  target:
    - dmg
    - zip

# electron-updater pulls release manifests directly from GitHub
# Releases. We deliberately set `owner` / `repo` explicitly rather
# than relying on `package.json#repository` parsing -- some builder
# versions choke on the `git+https://` prefix, and being explicit
# also makes it obvious where the update feed lives.
#
# `releaseType: release` skips drafts and prereleases. To ship a
# beta channel later, publish prereleases tagged `v1.2.3-beta.1`
# and override `channel: beta` in a dedicated build target.
publish:
  provider: github
  owner: PufferBlow
  repo: client
  releaseType: release
